name: Deploy OFF-04 Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy Worker only
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix worker

      - name: Run Worker Tests
        run: npm test --prefix worker

      - name: Typecheck Worker
        run: npm run typecheck --prefix worker

      - name: Deploy Worker and keep Cloudflare dashboard variables
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --keep-vars
