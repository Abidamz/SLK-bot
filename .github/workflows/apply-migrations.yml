name: Apply D1 Migrations

# Manual, by design. Migrations change production schema, so applying them is
# an explicit human action rather than something that rides along with every
# deploy. This exists so it can be done without any local setup: it uses the
# same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the deploy
# workflow already uses, so there is nothing to install and nothing to
# authenticate.
#
# How to run it: GitHub -> Actions -> "Apply D1 Migrations" -> Run workflow.
# Tick "apply" to actually write; leave it unticked for a dry run.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the migrations. Leave unticked to only list what is pending.'
        type: boolean
        required: false
        default: false
      database:
        description: 'D1 database name'
        type: string
        required: false
        default: 'slk-alert-db'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: worker

      - name: Show pending migrations (dry run)
        run: |
          echo "Pending migrations for ${{ inputs.database }}:"
          npx wrangler d1 migrations list "${{ inputs.database }}" --remote || true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        if: ${{ inputs.apply }}
        run: |
          npx wrangler d1 migrations apply "${{ inputs.database }}" --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm applied
        if: ${{ inputs.apply }}
        run: |
          npx wrangler d1 execute "${{ inputs.database }}" --remote \
            --command "SELECT name FROM pragma_table_info('slk_alerts') WHERE name='fill_confirmed'"
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
