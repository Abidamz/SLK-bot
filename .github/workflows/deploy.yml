name: Deploy SLK Radar

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy only from arena/01a0b153-slk-bot after tests pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix worker

      - name: Run Tests
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Dashboard JS
        run: node --check dashboard/app.js

  deploy:
    name: Deploy Worker & Pages to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/arena/01a0b153-slk-bot'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix worker

      - name: Deploy Cloudflare Worker (slk-alert-worker)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
          command: deploy

      - name: Deploy Cloudflare Pages (slk-radar)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard --project-name=slk-radar --branch=${{ github.ref_name }}
